name: Monthly Activity Summary

on:
  schedule:
    - cron: "0 0 1 * *"  # 1st of every month, midnight UTC
  workflow_dispatch:       # allow manual runs

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate activity summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Laotree
        run: |
          git pull origin main
          python3 .github/scripts/update_summary.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "No changes to commit" || (
            git add README.md &&
            git commit -m "chore: update monthly activity summary [skip ci]" &&
            git pull --rebase -X theirs origin main &&
            git push
          )
